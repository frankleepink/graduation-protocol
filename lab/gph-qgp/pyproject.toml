[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gph-qgp"
version = "0.3.0"
description = "GPH Quantum Gravity Phenomenology lab: toy modified-mechanics experiments for teaching and exploration"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.10"
authors = [
    { name = "Walter Hivoina", email = "whivoina@gmail.com" },
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gph-qgp = "gph_qgp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
